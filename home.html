<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome My Love ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
    background:linear-gradient(135deg,#ff6b81,#ff9a9e,#fad0c4);
}

.container{
    text-align:center;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    padding:40px;
    border-radius:25px;
    color:white;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    animation:fadeIn 2s ease;
}

h1{
    font-size:45px;
    text-shadow:0 0 15px white;
    animation:glow 2s infinite alternate;
}

p{
    margin:20px 0;
    font-size:20px;
    line-height:1.6;
}

button{
    padding:15px 35px;
    border:none;
    border-radius:50px;
    background:white;
    color:#ff4f81;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.08);
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(50px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes glow{
    from{
        text-shadow:0 0 10px white;
    }
    to{
        text-shadow:0 0 25px white,0 0 40px pink;
    }
}

.hearts{
    position:absolute;
    width:100%;
    height:100%;
    overflow:hidden;
    z-index:-1;
}

.heart{
    position:absolute;
    bottom:-50px;
    color:white;
    animation:float linear infinite;
}

@keyframes float{
    from{
        transform:translateY(0) rotate(0deg);
        opacity:1;
    }
    to{
        transform:translateY(-120vh) rotate(360deg);
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="hearts" id="hearts"></div>

<div class="container">
    <h1>❤️ Welcome ❤️</h1>

    <p>
        Happy Birthday, My Special One 💖<br><br>
        Today is all about celebrating you.<br>
        A little surprise is waiting just for you...
    </p>

    <button onclick="nextPage()">Open Surprise 🎁</button>
</div>
<!-- Replace music/happy-birthday.mp3 with your own file -->
<audio id="music" autoplay loop>
    <source src="home.mpeg" type="audio/mpeg">
</audio>

<script>

function nextPage(){
    window.location.href="letter.html";
}

// Floating Hearts Animation
const hearts=document.getElementById("hearts");

for(let i=0;i<60;i++){

    let heart=document.createElement("div");
    heart.className="heart";
    heart.innerHTML=["❤️","💖","💕","💗","💘"][Math.floor(Math.random()*5)];

    heart.style.left=Math.random()*100+"%";
    heart.style.fontSize=(15+Math.random()*30)+"px";
    heart.style.animationDuration=(5+Math.random()*8)+"s";
    heart.style.animationDelay=Math.random()*5+"s";

    hearts.appendChild(heart);
}

</script>

</body>
</html>
