<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happyyyyy Birthdayyyy Myyy love ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#ff6b81,#ff9a9e,#fad0c4);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
    flex-direction:column;
}

h1{
    color:white;
    margin-bottom:30px;
    text-shadow:0 0 15px white;
}

.cake{
    position:relative;
    width:220px;
}

.layer1{
    width:220px;
    height:60px;
    background:#ffb6c1;
    border-radius:12px;
}

.layer2{
    width:170px;
    height:50px;
    background:#ff8fab;
    border-radius:12px;
    margin:0 auto;
}

.layer3{
    width:120px;
    height:40px;
    background:#ff5c8a;
    border-radius:12px;
    margin:0 auto;
}

.candles{
    display:flex;
    justify-content:center;
    gap:18px;
    margin-bottom:-5px;
}

.candle{
    width:10px;
    height:40px;
    background:white;
    position:relative;
}

.flame{
    position:absolute;
    top:-16px;
    left:50%;
    transform:translateX(-50%);
    width:12px;
    height:16px;
    background:gold;
    border-radius:50% 50% 50% 50%;
    animation:flicker .4s infinite alternate;
}

@keyframes flicker{
    from{transform:translateX(-50%) scale(1);}
    to{transform:translateX(-50%) scale(1.15);}
}

button{
    margin-top:40px;
    padding:15px 30px;
    border:none;
    border-radius:30px;
    background:white;
    color:#ff4d6d;
    font-size:18px;
    cursor:pointer;
}

#msg{
    color:white;
    margin-top:20px;
    font-size:26px;
    display:none;
    text-align:center;
    padding:0 20px;
}

.heart{
    position:absolute;
    bottom:-20px;
    animation:float 8s linear infinite;
}

@keyframes float{
    from{transform:translateY(0);opacity:1;}
    to{transform:translateY(-120vh);opacity:0;}
}
</style>
</head>
<body>

<h1>🎂 Happy Birthday My Love ❤️</h1>

<div class="cake">

<div class="candles">
<div class="candle"><div class="flame"></div></div>
<div class="candle"><div class="flame"></div></div>
<div class="candle"><div class="flame"></div></div>
</div>

<div class="layer3"></div>
<div class="layer2"></div>
<div class="layer1"></div>

</div>

<button onclick="blowCandles()">🕯 Blow the Candles</button>

<h2 id="msg">
🎉 Happy Birthday kothiii! ❤️<br>
May all your dreams come true daaa!!<br>
lovee sooo muchhhh bangaraaa! 💖
</h2>

<!-- Replace music/happy-birthday.mp3 with your own file -->
<audio id="music" autoplay loop>
    <source src="cake.mpeg" type="audio/mpeg">
</audio>
 <button onclick="nextPage()">Open gift 🎁</button>

<script>
    function nextPage(){
    window.location.href="gift.html";
}

// Floating Hearts
for(let i=0;i<40;i++){
    let h=document.createElement("div");
    h.className="heart";
    h.innerHTML=["❤️","💕","💖","💘"][Math.floor(Math.random()*4)];
    h.style.left=Math.random()*100+"%";
    h.style.fontSize=(15+Math.random()*20)+"px";
    h.style.animationDuration=(5+Math.random()*5)+"s";
    h.style.animationDelay=Math.random()*5+"s";
    document.body.appendChild(h);
}

function blowCandles(){

    document.querySelectorAll(".flame").forEach(f=>{
        f.style.display="none";
    });

    document.getElementById("msg").style.display="block";

    launchConfetti();
}

function launchConfetti(){

    for(let i=0;i<120;i++){

        let c=document.createElement("div");

        c.innerHTML="🎊";

        c.style.position="absolute";
        c.style.left=Math.random()*100+"vw";
        c.style.top="-20px";
        c.style.fontSize=(10+Math.random()*18)+"px";
        c.style.transition="4s linear";

        document.body.appendChild(c);

        setTimeout(()=>{
            c.style.top="110vh";
            c.style.transform="rotate(720deg)";
        },50);

    }

}
</script>


</body>
</html>
